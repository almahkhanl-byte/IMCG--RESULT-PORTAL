<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMCG Korang Town - Result Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>IMCG Korang Town</h1>
            <p>Islamabad Model College for Girls</p>
            <h2>Online Result Portal</h2>
        </header>

        <div class="search-box">
            <label for="admissionNo">Enter Admission No:</label>
            <input type="text" id="admNo" placeholder="Example: G101, G201">
            <button onclick="getResult()">Result Dekhain</button>
        </div>

        <div id="result" class="result-box">
            <p>Apna Admission No daal kar result check karein</p>
        </div>

        <footer>
            <p>Data managed via Google Sheets | For IMCG Korang Town Students</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
